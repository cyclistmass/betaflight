<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 428" width="960" height="428" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>Bidir DShot timing at 8 kHz: on time, late loop today, late loop with a spin fix</title>
<rect width="960" height="420" fill="#ffffff"/>
<text x="20.0" y="28" fill="#1f2328" font-size="15" text-anchor="start" font-weight="600">One 125 us loop at 8 kHz: what the motor pin and the CPU do</text>
<text x="20.0" y="76" fill="#1f2328" font-size="13" text-anchor="start" font-weight="600">On time</text>
<text x="20.0" y="93" fill="#57606a" font-size="12" text-anchor="start" font-weight="400">loop finished early</text>
<text x="190.0" y="77" fill="#57606a" font-size="11" text-anchor="end" font-weight="400">pin</text>
<rect x="200.0" y="62" width="158.5" height="22" rx="3" fill="#2f6fbf" opacity="1"/>
<text x="279.2" y="78.0" fill="#fff" font-size="13" text-anchor="middle" font-weight="400">send 28 us</text>
<rect x="358.5" y="62" width="348.3" height="22" rx="3" fill="#2a9d8f" opacity="1"/>
<text x="532.6" y="78.0" fill="#fff" font-size="13" text-anchor="middle" font-weight="400">listen for RPM reply 62 us</text>
<text x="803.4" y="78" fill="#57606a" font-size="13" text-anchor="middle" font-weight="400">line free</text>
<line x1="900.0" y1="54" x2="900.0" y2="92" stroke="#1f2328" stroke-width="2"/>
<text x="896.0" y="106" fill="#1f2328" font-size="12" text-anchor="end" font-weight="400">next frame: no wait</text>
<text x="20.0" y="164" fill="#1f2328" font-size="13" text-anchor="start" font-weight="600">Late loop</text>
<text x="20.0" y="181" fill="#57606a" font-size="12" text-anchor="start" font-weight="400">master today</text>
<text x="190.0" y="165" fill="#57606a" font-size="11" text-anchor="end" font-weight="400">pin</text>
<text x="190.0" y="197" fill="#57606a" font-size="11" text-anchor="end" font-weight="400">CPU</text>
<rect x="200.0" y="150" width="158.5" height="22" rx="3" fill="#2f6fbf" opacity="1"/>
<text x="279.2" y="166.0" fill="#fff" font-size="13" text-anchor="middle" font-weight="400">send</text>
<rect x="358.5" y="150" width="348.3" height="22" rx="3" fill="#2a9d8f" opacity="1"/>
<text x="532.6" y="166.0" fill="#fff" font-size="13" text-anchor="middle" font-weight="400">listen</text>
<rect x="706.8" y="150" width="158.5" height="22" rx="3" fill="#2f6fbf" opacity="0.55"/>
<text x="786.0" y="166.0" fill="#fff" font-size="13" text-anchor="middle" font-weight="400">late send</text>
<rect x="424.0" y="182" width="282.8" height="22" rx="3" fill="#fbe3e0" opacity="1" stroke="#c0392b"/>
<text x="565.4" y="198" fill="#8e1b10" font-size="13" text-anchor="middle" font-weight="600">CPU waits in a busy loop ("spin"): up to 62 us</text>
<line x1="424.0" y1="142" x2="424.0" y2="210" stroke="#1f2328" stroke-width="2"/>
<text x="428.0" y="224" fill="#1f2328" font-size="12" text-anchor="start" font-weight="400">next motor update arrives at 40 us while the pin is still busy</text>
<text x="20.0" y="276" fill="#1f2328" font-size="13" text-anchor="start" font-weight="600">Late loop</text>
<text x="20.0" y="293" fill="#57606a" font-size="12" text-anchor="start" font-weight="400">with a spin fix</text>
<text x="190.0" y="277" fill="#57606a" font-size="11" text-anchor="end" font-weight="400">pin</text>
<text x="190.0" y="309" fill="#57606a" font-size="11" text-anchor="end" font-weight="400">CPU</text>
<rect x="200.0" y="262" width="158.5" height="22" rx="3" fill="#2f6fbf" opacity="1"/>
<text x="279.2" y="278.0" fill="#fff" font-size="13" text-anchor="middle" font-weight="400">send</text>
<rect x="358.5" y="262" width="348.3" height="22" rx="3" fill="#2a9d8f" opacity="1"/>
<text x="532.6" y="278.0" fill="#fff" font-size="13" text-anchor="middle" font-weight="400">listen (never cut short, see #15533)</text>
<rect x="424.0" y="294" width="16.8" height="22" rx="3" fill="#2da44e" opacity="1"/>
<text x="446.8" y="310" fill="#116329" font-size="13" text-anchor="start" font-weight="600">update skipped, CPU goes on at once</text>
<line x1="424.0" y1="254" x2="424.0" y2="322" stroke="#1f2328" stroke-width="2"/>
<line x1="900.0" y1="254" x2="900.0" y2="292" stroke="#1f2328" stroke-width="2"/>
<text x="896.0" y="306" fill="#1f2328" font-size="12" text-anchor="end" font-weight="400">next loop sends</text>
<text x="896.0" y="320" fill="#1f2328" font-size="12" text-anchor="end" font-weight="400">the new throttle</text>
<text x="428.0" y="336" fill="#1f2328" font-size="12" text-anchor="start" font-weight="400">the ESC keeps its last throttle for one loop</text>
<line x1="200.0" y1="362" x2="900.0" y2="362" stroke="#57606a"/>
<line x1="200.0" y1="358" x2="200.0" y2="366" stroke="#57606a"/>
<text x="200.0" y="381" fill="#57606a" font-size="12" text-anchor="middle" font-weight="400">0</text>
<line x1="358.5" y1="358" x2="358.5" y2="366" stroke="#57606a"/>
<text x="358.5" y="381" fill="#57606a" font-size="12" text-anchor="middle" font-weight="400">28.3</text>
<line x1="424.0" y1="358" x2="424.0" y2="366" stroke="#57606a"/>
<text x="424.0" y="381" fill="#57606a" font-size="12" text-anchor="middle" font-weight="400">40</text>
<line x1="706.8" y1="358" x2="706.8" y2="366" stroke="#57606a"/>
<text x="706.8" y="381" fill="#57606a" font-size="12" text-anchor="middle" font-weight="400">90.5</text>
<line x1="900.0" y1="358" x2="900.0" y2="366" stroke="#57606a"/>
<text x="900.0" y="381" fill="#57606a" font-size="12" text-anchor="middle" font-weight="400">125 us</text>
<text x="20.0" y="402" fill="#57606a" font-size="12" text-anchor="start" font-weight="400">Send: 51 states at 1.8 MHz. Listen: 140 samples at 2.25 MHz. Read from src/platform/STM32/dshot_bitbang.c.</text>
<text x="20.0" y="417" fill="#57606a" font-size="12" text-anchor="start" font-weight="400">The late write at 40 us is an example. In master the wait can last up to 62 us, with a 77 us backstop.</text>
</svg>
